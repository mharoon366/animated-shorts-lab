name: Blender Production Look and Motion Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "blender/production_scene.py"
      - ".github/workflows/blender-render.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install cached Blender release
        uses: bradyajohnston/setup-blender@v5
        timeout-minutes: 12
        with:
          version: "4.5"

      - name: Verify Blender
        run: |
          blender --version | head -n 2

      - name: Render high-quality hero still
        timeout-minutes: 10
        run: |
          mkdir -p output/hero
          blender -b --python blender/production_scene.py -- \
            --mode hero --width 540 --out output/hero
          test -s output/hero/bucket_war_hero.png

      - name: Report continuity, grip gap and framing across all 90 frames
        timeout-minutes: 3
        run: |
          blender -b output/hero/bucket_war_production.blend --python blender/quality_gate.py -- \
            --out output/quality_report.json
          test -s output/quality_report.json

      - name: Render 3-second 30fps H.264 video in Blender
        timeout-minutes: 18
        run: |
          mkdir -p output/preview
          blender -b --python blender/production_scene.py -- \
            --mode preview --seconds 3 --width 360 --out output/preview
          test -s output/preview/bucket_war_production_test.mp4
          python3 - <<'PY'
          import os, struct
          p='output/preview/bucket_war_production_test.mp4'
          with open(p,'rb') as f: header=f.read(24)
          assert b'ftyp' in header, 'Not a valid MP4'
          assert os.stat(p).st_size > 8192, 'Empty MP4 output'
          print('Validated MP4 bytes:',os.stat(p).st_size)
          PY

      - name: Upload review media and editable scene
        uses: actions/upload-artifact@v4
        with:
          name: bucket-war-production-qa
          path: |
            output/preview/bucket_war_production_test.mp4
            output/hero/bucket_war_hero.png
            output/quality_report.json
            output/hero/bucket_war_production.blend
          retention-days: 14
          if-no-files-found: error
